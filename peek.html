<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>peek — placement peephole</title>

<!-- THE PLACEMENT PEEPHOLE. goldens.html answers "did the pixels change";
     this answers "does the arrangement read" — it parks the real camera at an
     exact bearing and distance inside a home and holds it there, so a `lean`,
     a `spin` or an `out` can be judged and re-measured against the built
     scene instead of walked to on the stick every time the number moves.
     Driven by the query string — see the header of js/peek.js.

     Kept at the repo root for goldens.html's own reason: the art loads from
     './asset/images/', relative to the document, and a page in a
     subdirectory would load nothing.

     Not registered in sw.js and not linked from anywhere: a workbench, never
     part of what a visitor downloads. -->

<style>
  body { margin: 0; background: #14171c; overflow: hidden; }
  #stage { display: block; width: 100vw; height: 100vh; }
  #log {
    position: fixed; left: 10px; top: 8px; color: #C8CDD6;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre; pointer-events: none; text-shadow: 0 1px 2px #0008;
  }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="log">booting…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
<script type="module" src="./js/peek.js"></script>
</body>
</html>
