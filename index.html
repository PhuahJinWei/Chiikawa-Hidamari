<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#BFE4F5">
<meta name="description" content="ちいかわと ゆっくり すごす、ちいさな ひだまり。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひだまり">
<title>ちいかわと ひだまり</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<!-- iOS ignores SVG for the home screen, so this one has to be a PNG. -->
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="stage"></canvas>

<div id="bubbles"></div>

<!-- Which way somebody is, when they are not on screen to be seen. Filled from
     main.js, one chip per character plus the house. Purely a drawing: it takes
     no touches, so a chip sitting over the pad or the pills changes nothing
     about pressing them. -->
<div id="marks" class="marks" aria-hidden="true"></div>

<!-- The dark of a doorway. It is solid for the moment the world on the other
     side of the door is swapped in, and gone again before you could look for
     it — see js/door.js. Driven frame by frame from there rather than by a CSS
     transition, because it has to stay in step with a camera move. -->
<div id="veil" class="veil" aria-hidden="true"></div>

<div id="stick" class="stick" aria-hidden="true">
  <div id="stick-knob" class="stick-knob"></div>
</div>

<!-- The action cluster, on foot only: jump (the same hop a double tap on the
     ground makes) and sprint, which arms a run and stands down on its own when
     you stop. Drawn the way game controls are drawn — translucent circles with
     a glyph, sized and offset for where a right thumb actually arcs — and NOT
     in the pill stack, because they are a different kind of thing: a verb
     under the thumb rather than a reading of the world. Both fade out with
     the ground, since neither means anything in the sky. -->
<div id="actions" class="actions">
  <button id="jump-btn" class="act act-jump" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 17.5V6.5"/>
      <path d="m7 11.5 5-5 5 5"/>
      <path d="M6.5 21c3.4-1.7 7.6-1.7 11 0"/>
    </svg>
    <span class="sr-only">ジャンプ</span>
  </button>
  <button id="sprint-btn" class="act act-sprint" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m6.5 5.5 6.5 6.5-6.5 6.5"/>
      <path d="m13 5.5 6.5 6.5-6.5 6.5"/>
    </svg>
    <span class="sr-only">はしる</span>
  </button>

  <!-- THE INTERACTION STACK. Every verb the world is offering right now, one
       pill each, growing upward out of the thumb's arc — the arrangement every
       modern open-world game landed on, for the reason they all landed on it:
       standing somewhere that affords two things is normal, and a control that
       shows one of them has to pick, which means the other becomes unreachable
       from that spot.

       It used to pick. Three separate buttons — a verb pill, a しまう pill and
       a light circle — each with its own corner and its own rule about when to
       appear, and the verb pill ranked its candidates and showed the winner.
       Standing at the water's edge beside a bear you could pick up, ひろう beat
       つりをする and there was no way to fish without first walking away from
       the bear. That is the bug this shape does not have: nothing ranks, so
       nothing is hidden.

       WHAT GOES IN IT IS DECIDED BY WHERE YOU ARE LOOKING, not merely by what
       is near — see the focus in main.js, which came later and fixed the other
       half of this. A pill about an object also NAMES that object, so 「ひろう」
       says which of the two things at your feet it means, in a smaller word
       beside the verb.

       Built and emptied entirely from main.js — see the stack there for what
       goes in it and in what order. Empty is the resting state and an empty
       flex column occupies nothing, so with your hands free and facing nothing
       in particular, this corner is jump and sprint alone. -->
  <div id="interact" class="interact"></div>
</div>

<div id="controls" class="controls">
  <!-- SORTED BY HOW OFTEN YOU REACH FOR IT, not by what kind of thing it is.
       Four word-pills stood here permanently, about 100×214px of furniture over
       the corner of a drawing, and the four were not remotely equal: そらへ is
       how you get about and もちもの is how you hand somebody a flower, both
       many times a session, while the clock and the 図鑑 are things you visit.
       The two you live in stay out; the two you visit fold behind the button
       below them.

       Collapsing ALL of it behind one menu was the other option and it is worse:
       it would put a friend's present three taps away to save a pill. -->
  <div id="ctl-stack" class="ctl-stack">
    <button id="view-toggle" class="ctl ctl-pill" type="button">そらへ</button>

    <!-- The pouch. The pill is only the way in now: what it opens is the sheet
         at the bottom of this file, in the middle of the screen. -->
    <div id="pouch" class="pouch">
      <button id="pouch-toggle" class="ctl ctl-pill" type="button">もちもの</button>
    </div>

    <!-- The rest, and the only round control up here. Round because it is not a
         verb and not a reading — the two shapes this screen already uses — and
         a circle of dots is the one glyph that means "there is more" without
         having to say what. It sits at the BOTTOM of the stack so that what it
         opens appears below it: nothing above ever moves, and the two pills you
         actually live in hold their positions whether this is open or shut. -->
    <button id="menu-toggle" class="ctl ctl-more" type="button" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5.5" cy="12" r="1.7"/>
        <circle cx="12" cy="12" r="1.7"/>
        <circle cx="18.5" cy="12" r="1.7"/>
      </svg>
      <span class="sr-only">そのほか</span>
    </button>

    <!-- The clock, and the day it opens into. The pill stays in flow so the
         stack keeps its size; the panel is absolute and grows out of the pill's
         own top-right corner, so opening it moves nothing else. Its label is
         the hour you are in, which was worth a permanent seat only until you
         notice the sky says the same thing louder. -->
    <div id="time" class="time">
      <button id="time-toggle" class="ctl ctl-pill ctl-time" type="button">ひる</button>

      <div id="time-panel" class="time-panel">
        <button id="time-auto" class="time-auto" type="button">じどう</button>
        <div class="time-scrub">
          <div id="time-track" class="time-track" role="slider"
               aria-label="じかん" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
            <div id="time-knob" class="time-knob"></div>
          </div>
          <!-- Filled from PHASES so the labels can never drift from the day. -->
          <div id="time-marks" class="time-marks"></div>
        </div>
      </div>
    </div>

    <!-- The collection, out of the pack and into a room of its own. It shared
         the pack's panel while both were small, and stopped making sense the
         moment the pack became slots: one is what you are carrying now, the
         other is what you have ever caught, and they are not the same question
         asked twice. -->
    <div id="zukan" class="pouch">
      <button id="zukan-toggle" class="ctl ctl-pill" type="button">ずかん</button>
    </div>
  </div>
</div>

<!-- THE SHEET: the bag, and the book. One card in the middle of the screen over
     a scrim, staying open until it is dismissed.

     Both of these used to be drawers hanging off their own pills — capped at
     230px in the corner, folded away by the same forgotten-about timer the
     clock uses. That shape is right for the clock, which you GLANCE at. It is
     wrong for these two, which you go INTO: one to find something and hand it
     over, the other to read. The corner cap was also what held the pack's slots
     down to 44px, which is most of why a full pack looked cramped.

     One card serves both because they are never both wanted — opening either
     closes the other — and a second scrim would only be a second thing to keep
     in step with this one. Which of the two is in it is decided by openSheet in
     main.js, along with everything that goes inside; nothing here is static
     except the frame. -->
<div id="sheet" class="sheet">
  <div id="sheet-scrim" class="sheet-scrim"></div>

  <div id="sheet-card" class="sheet-card" role="dialog" aria-modal="true"
       aria-labelledby="sheet-title">
    <p id="sheet-title" class="sheet-title"></p>

    <button id="sheet-close" class="sheet-close" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
      </svg>
      <span class="sr-only">とじる</span>
    </button>

    <div id="sheet-body" class="sheet-body"></div>

    <!-- The one line under it all, doing three jobs: it names what is in your
         hand, it teaches the long press, and it is what an empty pack says
         instead of sixteen silent dashed holes. -->
    <p id="sheet-cap" class="sheet-cap"></p>

    <!-- ALWAYS ON, and it is here because the line above is not. That one is a
         state — what is in your hand, how many you are about to throw away — so
         the moment you pick anything up it has something else to say, and while
         it was also the only place the gestures were named, carrying something
         silently deleted the instructions. A hint that hides exactly when you
         are most likely to want it is not a hint. -->
    <p id="sheet-hint" class="sheet-hint"></p>

    <!-- GETTING RID OF SOMETHING, and it only exists while a slot is lifted.
         The long press already means "this one, now where" — so the answer is
         either another slot, or this row: one more destination rather than a
         second gesture and a button sitting there in the resting state.

         The verb depends on what is lifted, because the two endings are not the
         same act. A stackable is let go of and gone (there is more grass). A
         unique is SET DOWN — there is one bear, and its answer is the same
         loose-furniture placement 「おく」 has always used, so it lands at your
         feet where you can see it rather than ceasing to exist. The count only
         appears for the first, since there is never more than one of the
         second. -->
    <div id="sheet-act" class="sheet-act">
      <div id="sheet-count" class="sheet-count">
        <button class="count-step" type="button" data-step="-1" aria-label="へらす">−</button>
        <span id="count-n" class="count-n">1</span>
        <button class="count-step" type="button" data-step="1" aria-label="ふやす">＋</button>
        <button id="count-all" class="count-all" type="button">ぜんぶ</button>
      </div>
      <button id="sheet-drop" class="sheet-drop" type="button"></button>
    </div>
  </div>
</div>

<!-- The front door. A whole screen rather than a card, because it is the first
     thing anybody sees, it is on for as long as the art takes to decode, and it
     is the only place the three gestures are ever explained.

     The meadow behind it is bg-menu.webp, hung from the stylesheet. Nothing on
     this screen may come out of `IMG`, because this screen is what covers the
     wait for exactly that — but a file the browser fetches for itself, outside
     loadArt()'s batch, is free to arrive whenever it arrives. Same arrangement
     as the car on the road below.

     The layout is blocked around where that drawing is busy: the title sits in
     the empty sky, the middle third is left alone because that is where the
     hills, the tree and the little house are, the road crosses the open meadow,
     and the button drops into the one clean corridor between the three of them
     at the bottom. Move anything vertically and check it against the art. -->
<div id="start" class="start">

  <div class="start-sheet">

    <header class="start-head">
      <p class="start-eyebrow">ちいさな ほし</p>
      <!-- The space is for whoever is listening rather than looking: without it
           the accessible name runs the two halves together. It costs nothing on
           screen, since a trailing space at a forced break is dropped. -->
      <h1 class="start-title">ちいかわと <br>ひだまり</h1>
    </header>

    <div class="start-foot">
      <!-- How far in we are, as a drive rather than a bar. The car faces left,
           so it starts at the right-hand kerb and the road it has already
           covered is the stretch behind it. One number drives all of it: --p,
           written by main.js as each file lands. -->
      <div id="loadbar" class="loadbar">
        <div class="loadbar-road"></div>
        <div class="loadbar-done"></div>
        <img id="loadbar-car" class="loadbar-car" alt="" decoding="async">
      </div>

      <p class="start-status">
        <!-- Reads as loading until main.js has the art decoded, then it swaps
             to the invitation and the button below it turns on. Tapping early
             does nothing, because the listener is registered in the same module
             that awaits the load. -->
        <span id="start-sub" class="start-sub">よみこみちゅう…</span>
        <span id="start-pct" class="start-pct">0%</span>
      </p>

      <!-- Empty, and therefore not displayed, unless the load fails. -->
      <p id="start-note" class="start-note"></p>

      <!-- The affordance, not the mechanism: the press is caught on the whole
           overlay, so anywhere on the screen still works. -->
      <button id="start-go" class="start-go" type="button">はじめる</button>
    </div>

  </div>
</div>

<!-- Which of the three is driving today. Here rather than in main.js because
     main.js is a module: it does not run until three.js and every other import
     has been fetched and evaluated, and that wait is precisely what this car is
     on screen to cover. Two lines at parse time get it moving straight away. -->
<script>
  document.getElementById('loadbar-car').src =
    './asset/images/loading-' + (1 + Math.floor(Math.random() * 3)) + '.png';
</script>

<div class="rotate-hint"><p>たてむきに してね</p></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
