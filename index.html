<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#BFE4F5">
<meta name="description" content="ちいかわと ゆっくり すごす、ちいさな ひだまり。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ひだまり">
<title>ちいかわと ひだまり</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./asset/images/chiikawa-house-plate.png" type="image/png">
<!-- iOS ignores SVG for the home screen, so this one has to be a PNG. -->
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/style.css">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="stage"></canvas>

<div id="bubbles"></div>

<!-- Which way somebody is, when they are not on screen to be seen. Filled from
     main.js, one chip per character plus the house. Purely a drawing: it takes
     no touches, so a chip sitting over the pad or the pills changes nothing
     about pressing them. -->
<div id="marks" class="marks" aria-hidden="true"></div>

<!-- The dark of a doorway. It is solid for the moment the world on the other
     side of the door is swapped in, and gone again before you could look for
     it — see js/door.js. Driven frame by frame from there rather than by a CSS
     transition, because it has to stay in step with a camera move. -->
<div id="veil" class="veil" aria-hidden="true"></div>

<div id="stick" class="stick" aria-hidden="true">
  <div id="stick-knob" class="stick-knob"></div>
</div>

<!-- The action cluster, on foot only: jump (the same hop a double tap on the
     ground makes), sprint, which arms a run and stands down on its own when
     you stop, and sit. Drawn the way game controls are drawn — translucent
     circles with a glyph, sized and offset for where a right thumb actually
     arcs — and NOT in the pill stack, because they are a different kind of
     thing: a verb under the thumb rather than a reading of the world. All
     three fade out with the ground, since none of them means anything in the
     sky.

     SIT MOVED HERE from the stack, and the move is a correction rather than a
     preference. Every pill is about something out in the world — a thing you
     face, a thing you hold, somebody in front of you — and sitting has no
     target at all: it is about your own body, exactly as jump and sprint are.
     It needed a family of one to live among them, and a taxonomy with a family
     of one in it is telling you something does not belong. It was also the
     most volatile pill in the app, appearing every time you stopped and going
     every time you walked, which shuffled every pill above it; it had already
     been given a private exemption from the stack's own arrival bounce for
     exactly that reason. Here it is simply always there on foot, like its two
     neighbours. -->
<div id="actions" class="actions">
  <button id="jump-btn" class="act act-jump" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 17.5V6.5"/>
      <path d="m7 11.5 5-5 5 5"/>
      <path d="M6.5 21c3.4-1.7 7.6-1.7 11 0"/>
    </svg>
    <span class="sr-only">ジャンプ</span>
  </button>
  <button id="sprint-btn" class="act act-sprint" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m6.5 5.5 6.5 6.5-6.5 6.5"/>
      <path d="m13 5.5 6.5 6.5-6.5 6.5"/>
    </svg>
    <span class="sr-only">はしる</span>
  </button>
  <!-- Sit, and stand back up. TWO GLYPHS IN ONE CIRCLE, swapped by the `is-on`
       class main.js writes from the rig — the circle-cluster edition of the rule
       the light pill already follows: a control says what pressing it DOES
       rather than what you currently are. Both are drawn here rather than one
       being built in JS, so the shapes live with the other glyphs and neither
       has to be assembled from a string. -->
  <button id="sit-btn" class="act act-sit" type="button" aria-pressed="false">
    <svg class="act-sit-down" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 4.6v7.6h7.8"/>
      <path d="M5.4 12.2h11.4"/>
      <path d="M7.2 15.1v4.3"/>
      <path d="M15 15.1v4.3"/>
    </svg>
    <svg class="act-sit-up" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 19.4V6.2"/>
      <path d="m7.4 10.8 4.6-4.6 4.6 4.6"/>
    </svg>
    <span class="sr-only">すわる／たつ</span>
  </button>

  <!-- THE INTERACTION STACK. Every verb the world is offering right now, one
       pill each, growing upward out of the thumb's arc — the arrangement every
       modern open-world game landed on, for the reason they all landed on it:
       standing somewhere that affords two things is normal, and a control that
       shows one of them has to pick, which means the other becomes unreachable
       from that spot.

       It used to pick. Three separate buttons — a verb pill, a しまう pill and
       a light circle — each with its own corner and its own rule about when to
       appear, and the verb pill ranked its candidates and showed the winner.
       Standing at the water's edge beside a bear you could pick up, ひろう beat
       つりをする and there was no way to fish without first walking away from
       the bear. That is the bug this shape does not have: nothing ranks, so
       nothing is hidden.

       WHAT GOES IN IT IS DECIDED BY WHERE YOU ARE LOOKING, not merely by what
       is near — see the focus in main.js, which came later and fixed the other
       half of this. A pill about an object also NAMES that object, so 「ひろう」
       says which of the two things at your feet it means, in a smaller word
       beside the verb.

       Built and emptied entirely from main.js — see the stack there for what
       goes in it and in what order. Empty is the resting state and an empty
       flex column occupies nothing, so with your hands free and facing nothing
       in particular, this corner is jump and sprint alone. -->
  <div id="interact" class="interact"></div>
</div>

<!-- READINGS ON THE LEFT, ACTIONS ON THE RIGHT, and nothing hidden.

     Five controls lived up here in one right-hand column — そらへ, もちもの, a
     ・・・ drawer, and behind that drawer the clock, the sky and the ずかん. Three
     things were wrong with it and only one of them was the styling:

     - IT SPOKE TWO LANGUAGES. Down at the thumbs this screen is a game pad:
       equal circles, glyphs, fixed places. Up here it was a document — word
       pills of four different widths (そらへ 96px, もちもの 118px, the clock
       changing width every time the hour did), stacked to a ragged edge.
     - IT HID THE TWO THINGS WORTH SEEING. Time and weather are not commands,
       they are the state of the world, and a game named for sunlight had them
       folded behind an unlabelled ・・・ — unreadable at a glance AND two taps to
       reach.
     - IT FILED THE CAMERA UNDER MENUS. そらへ is how you move your view. It
       belongs with the stick and the jump, not with the bag.

     So: the sky is one chip in the top-left, which is a READING you can press;
     the two verbs are equal circles in the top-right; the ずかん is a tab inside
     the sheet it always shared a card with; and the drawer is gone, because
     after the merge there was nothing left to fold. Five controls, two of them
     invisible, became three that are all one tap. -->
<div id="controls" class="controls">

  <!-- THE SKY, both halves of it, as one reading.
       The hour and the weather were two pills asking the same question, and the
       answer is one sentence: it is noon and it is snowing. So they are one chip
       with one panel behind it — which is also better than two panels, because
       the two interact. Snow at noon and snow at midnight are different skies,
       and choosing them in the same place is how you find that out.
       The glyphs and the word are written by paintChip in main.js. -->
  <div id="sky-stack" class="sky-stack">
  <div id="sky-chip" class="chip-wrap">
    <button id="chip-toggle" class="chip" type="button">
      <span id="chip-hour-mark" class="chip-mark" aria-hidden="true"></span>
      <span id="chip-hour" class="chip-word">ひる</span>
      <span class="chip-rule" aria-hidden="true"></span>
      <span id="chip-sky-mark" class="chip-mark" aria-hidden="true"></span>
    </button>

    <div id="chip-panel" class="chip-panel">
      <!-- THE DAY IS AN AXIS and the sky is not, which is why one is a scrubber
           and the other a grid. Morning runs to noon runs to evening and halfway
           between two of them is a real place to be. Rain is not "more" than
           cloud on any line you could slide along, and snow is off in a
           direction of its own — so those are laid out as a set, which is what
           they are. -->
      <div class="chip-sec">
        <p class="chip-head">じかん</p>
        <button id="time-auto" class="time-auto" type="button">じどう</button>
      </div>
      <div class="time-scrub">
        <div id="time-track" class="time-track" role="slider"
             aria-label="じかん" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0">
          <div id="time-knob" class="time-knob"></div>
        </div>
        <!-- Filled from PHASES so the labels can never drift from the day. -->
        <div id="time-marks" class="time-marks"></div>
      </div>

      <div class="chip-sec chip-sec-2">
        <p class="chip-head">そら</p>
        <button id="sky-auto" class="time-auto" type="button">じどう</button>
      </div>
      <!-- Filled from the weather table itself, so the panel can never offer a
           sky the world does not have. -->
      <div id="sky-grid" class="sky-grid"></div>
    </div>
  </div>

  <!-- カメラ — the lens swung round to look back at you.

       IT IS NOT HERE UNTIL YOU OWN A CAMERA. The compact camera resting in
       Hachiware's cave is the feature: pick it up (or carry it in the pouch)
       and this button exists; set it down somewhere and it goes away again.
       Hidden rather than greyed, because a control for an ability you have not
       found yet is not disabled — it is a spoiler. The gate is painted every
       frame in main.js, off the same pack the pouch reads.

       It left the right-hand column for this corner when it stopped being a
       standing view control and became a TOOL: the right column is the verbs
       you always have, and a thing that can be found and lost belongs with the
       readings rather than among them. Below the chip, not beside it — the
       open panel is 322px and paints over this spot on purpose (chip-wrap is
       z-index 2), the same order it already keeps with the pouch.

       A CAMERA, not an eye or a person: the shot is the point, and a lens with
       a shutter says "this is a picture of you" where a silhouette would only
       say "you". The disc is the body and the small circle its glass.

       IT TURNS OVER, because that is what the thing itself does. This is the one
       control in the app whose two states are a physical act — a lens swung
       round to face the other way — and a caption that merely swapped words was
       describing that instead of showing it. So the disc has two faces on a Y
       axis: カメラ with the camera on the front, もどる with a turning-back arrow
       on the back, and pressing it rotates one into the other. The word changes
       at the halfway point, when the face it belongs to is edge-on and neither
       is readable, so the two never disagree on screen.

       Both faces live in the markup rather than being swapped by script. A flip
       needs both sides present at once — that is the whole of what makes it a
       flip rather than a substitution — and it also takes the caption off the
       render loop, which was writing a string every frame to change it twice a
       session. -->
  <button id="selfie-toggle" class="ctl-icon ctl-fade is-gone" type="button"
          aria-pressed="false">
    <span class="ctl-disc flip-disc">
      <span class="flip-inner">
        <span class="flip-face flip-front">
          <!-- The camera itself: body, the raised hump over the viewfinder, and
               the glass. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.9 8.4h3.4l1.4-2.2h8.6l1.4 2.2h3.4v9.9a1 1 0 0 1-1 1H3.9a1 1 0 0 1-1-1Z"/>
            <circle cx="12" cy="13.3" r="3.3"/>
            <path d="M18.4 11h1.1"/>
          </svg>
        </span>
        <span class="flip-face flip-back">
          <!-- An arrow that comes round and points back the way you came. Not a
               second camera and not an eye: this face is not about the tool, it
               is about undoing the thing the other face did. -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17.4 19.1v-5.4a4.5 4.5 0 0 0-4.5-4.5H7.1"/>
            <path d="M10.4 5.7 6.4 9.2l4 3.5"/>
          </svg>
        </span>
      </span>
    </span>
    <span class="ctl-cap flip-cap">
      <span class="cap-front">カメラ</span>
      <span class="cap-back">もどる</span>
    </span>
  </button>

  <!-- THE POSES, and they are a drawer now rather than a row.

       Five pills laid along the bottom of the screen were five words competing
       with the picture they were there to help you compose — and they sat in
       the lower middle, which is exactly where a shutter has to go. Collapsed
       to one button under the camera, the framing gets its screen back and the
       faces are still one press away.

       The panel opens BELOW the button and the button's caption says which face
       is chosen, so the collapsed state still answers the question the row
       answered by being visible. Same grammar as the sky chip two above it: a
       reading you can press, with the choices behind it. -->
  <div id="pose-wrap" class="pose-wrap ctl-fade is-gone">
    <button id="pose-toggle" class="ctl-icon" type="button" aria-expanded="false">
      <!-- YOUR OWN FACE, not a drawing of a face.

           This was a generic smiley in the app's line pen, and it was the wrong
           thing twice over: it is the only picture in the HUD that had to stand
           for something already drawn, and a smiley is nobody in particular
           where the thing being chosen is very specifically YOU. The four sheets
           exist — see PLAYER in cast.js — so the button wears the face it is
           set to and the drawer offers the real ones. Nothing here has to be
           guessed from a word.

           Both children live here and paintPoses shows one: 「おまかせ」 is the
           app choosing, which is not a face at all, so it gets a mark instead
           of one rather than borrowing the resting sheet and claiming to be it. -->
      <span class="ctl-disc pose-disc">
        <img id="pose-face" class="pose-face" alt="">
        <svg id="pose-auto" class="pose-auto" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.1l1.5 4.2 4.2 1.5-4.2 1.5L12 15.5l-1.5-4.2L6.3 9.8l4.2-1.5Z"/>
          <path d="M18.1 14.5l.75 2.05 2.05.75-2.05.75-.75 2.05-.75-2.05-2.05-.75 2.05-.75Z"/>
        </svg>
      </span>
      <span id="pose-cap" class="ctl-cap">おまかせ</span>
    </button>
    <!-- Filled from POSES in main.js, so the panel can never offer a face the
         avatar has no sheet for. -->
    <div id="pose-bar" class="pose-bar" role="group" aria-label="ポーズ"></div>
  </div>
  </div>

  <!-- THE TWO VERBS. Equal circles with the word underneath rather than pills
       with the word inside: a fixed 52px disc aligns with the one above it
       forever, whatever the label says or what language it is in, which is the
       whole of what was ragged before. The caption stays because this app talks
       — every other control here is a word, and a bare glyph would be the only
       thing on screen asking to be guessed at.

       THE ORDER IS BY REACH, and in this corner that means the bag goes at the
       BOTTOM. A thumb comes up from the base of the phone, so of two buttons in a
       right-hand column the lower one is the nearer — and かばん is the one you
       reach for over and over, to hand somebody a flower or put a fish away,
       while そらへ is how you get about. The stack used to be the other way round
       and had the frequent one furthest from the hand. -->
  <div id="ctl-stack" class="ctl-stack">
    <!-- The glyph turns over with the verb, so it says what pressing it DOES
         rather than where you happen to be — the rule the action pills already
         follow. See the swap in frame(). -->
    <button id="view-toggle" class="ctl-icon" type="button">
      <span class="ctl-disc">
        <svg id="view-glyph" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.6 16.2c3.4-2.6 5.7-3.9 8.4-3.9s5 1.3 8.4 3.9"/>
          <path d="M12 10.6V3.4"/>
          <path d="m8.6 6.4 3.4-3 3.4 3"/>
        </svg>
      </span>
      <span id="view-cap" class="ctl-cap">そらへ</span>
    </button>
    <!-- The selfie toggle stood here, under そらへ, back when everybody had it.
         It is up with the sky chip now, and it is EARNED — see the note there. -->
    <!-- The shutter stood here as a third disc in the column, wearing とる under
         it like the two verbs beside it. It is down in the middle of the screen
         now and it is a SHUTTER — see .shot-btn. -->
    <div id="pouch" class="pouch">
      <button id="pouch-toggle" class="ctl-icon" type="button">
        <!-- A BACKPACK, and it was a tote — a trapezoid with a wide handle arched
             over the top, which is the shape every shop icon on a phone uses. It
             read as "store", not as "your things".

             Three strokes carry the difference. The body is upright and rounded
             rather than tapering, because a tote flares and a pack does not. The
             handle is a SMALL grab loop on top instead of a wide carrying arc —
             that one change does most of the work, since the wide arc is the part
             that says shopping. And the front pocket is open at the base so it
             sits ON the pack rather than being a box drawn inside it. A flap line
             across the lid was tried too and dropped: at 24px three horizontal
             bands start reading as a stack of lines rather than as a bag. -->
        <span class="ctl-disc">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.9 20.4v-8.8a4.4 4.4 0 0 1 4.4-4.4h5.4a4.4 4.4 0 0 1 4.4 4.4v8.8a1.4 1.4 0 0 1-1.4 1.4H6.3a1.4 1.4 0 0 1-1.4-1.4Z"/>
            <path d="M9.9 7.3V6.1a2.1 2.1 0 0 1 4.2 0v1.2"/>
            <path d="M8.7 21.8v-5.1a1 1 0 0 1 1-1h4.6a1 1 0 0 1 1 1v5.1"/>
          </svg>
        </span>
        <span class="ctl-cap">かばん</span>
      </button>
    </div>

  </div>
</div>

<!-- THE SHEET: the bag, and the book. One card in the middle of the screen over
     a scrim, staying open until it is dismissed.

     Both of these used to be drawers hanging off their own pills — capped at
     230px in the corner, folded away by the same forgotten-about timer the
     clock uses. That shape is right for the clock, which you GLANCE at. It is
     wrong for these two, which you go INTO: one to find something and hand it
     over, the other to read. The corner cap was also what held the pack's slots
     down to 44px, which is most of why a full pack looked cramped.

     One card serves both because they are never both wanted — opening either
     closes the other — and a second scrim would only be a second thing to keep
     in step with this one. Which of the two is in it is decided by openSheet in
     main.js, along with everything that goes inside; nothing here is static
     except the frame. -->
<div id="sheet" class="sheet">
  <div id="sheet-scrim" class="sheet-scrim"></div>

  <!-- Named by whichever tab is selected, since the title it used to point at is
       gone and the tabs are what say which room this is. -->
  <div id="sheet-card" class="sheet-card" role="dialog" aria-modal="true"
       aria-label="もちもの">
    <!-- TWO ROOMS, ONE DOOR. The ずかん had a pill of its own in the corner, and
         it opened this same card — a second entrance to a building you were
         already standing in. As tabs the relationship is the true one: what you
         are carrying and what you have ever caught are two views of your own
         collection, and getting between them costs one tap instead of closing
         the card, finding another pill, and opening it again.

         The title went with the pill. A tab bar already says which room you are
         in, and saying it twice was the sort of thing you only notice is noise
         once it is gone. -->
    <div class="sheet-tabs" role="tablist">
      <button id="tab-pack" class="sheet-tab" type="button" role="tab"
              aria-selected="true">もちもの</button>
      <button id="tab-zukan" class="sheet-tab" type="button" role="tab"
              aria-selected="false">ずかん</button>
    </div>

    <button id="sheet-close" class="sheet-close" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6.5 6.5 17.5 17.5M17.5 6.5 6.5 17.5"/>
      </svg>
      <span class="sr-only">とじる</span>
    </button>

    <div id="sheet-body" class="sheet-body"></div>

    <!-- WHAT YOU TAPPED, AND WHAT YOU CAN DO WITH IT.
         This was one dimmed caption line plus a row of buttons that existed only
         while a tile was in the air. Both were the same idea half-built: there
         was a place under the grid where the pack talks to you, and it spent
         almost all of its life either blank or saying the name of the thing your
         own finger was on.

         So a tap is now a QUESTION rather than an action. It picks a slot and
         this panel answers it — the drawing at a size you can actually see, what
         the thing is called, how many you have, and one line you could not have
         got from looking at the tile. The verbs come with the answer, which is
         where they belong: you decide to put something down AFTER you have
         looked at it, not before.

         It never leaves and never changes height. The card used to grow and
         shrink as the row came and went, and a panel that moves under your thumb
         while you are reading it is worse than one that is sometimes empty. -->
    <div id="sheet-detail" class="detail">
      <!-- The resting line, and the one an empty pack shows: sixteen silent
           dashed holes and no words is a panel that looks broken rather than one
           that looks empty. -->
      <p id="detail-hint" class="detail-hint"></p>

      <div id="detail-item" class="detail-item">
        <span class="detail-tile"><img id="detail-img" alt=""></span>
        <span class="detail-text">
          <span id="detail-name" class="detail-name"></span>
          <!-- The family and the numbers share a row so the NAME gets the full
               width of the column. Standing the chip beside the name instead
               cost about seventy pixels there, which is the difference between
               「うすむらさきの おさかな」 fitting on one line and not. -->
          <span class="detail-sub">
            <span id="detail-fam" class="detail-fam"></span>
            <span id="detail-meta" class="detail-meta"></span>
          </span>
          <span id="detail-note" class="detail-note"></span>
        </span>
      </div>

      <!-- THE TWO VERBS.
           Taking a thing in hand is what the grid's tap used to mean on its own,
           and it reads better as a button that says so than as a tap that has to
           be learned.

           The second is not one verb but two, because the two endings are not the
           same act and never were. A stackable is LET GO OF and gone — there is
           more grass. A unique is SET DOWN: there is one bear, and its answer is
           the loose-furniture placement 「おく」 has always used, so it lands at
           your feet where you can walk over and pick it up again. Same button,
           two glyphs, and the glyph is the half that matters — a rubbish bin
           drawn under a bear would be a promise to destroy it. -->
      <div id="detail-act" class="detail-act">
        <button id="act-hold" class="act-btn" type="button"></button>
        <!-- ALSO THE DROP TARGET. Dragging a tile onto this is the shortcut past
             the panel, and it is deliberately the same object you would press:
             one bin on screen rather than a button and a separate landing zone
             that have to be kept looking like the same idea. -->
        <button id="act-bin" class="act-btn act-bin" type="button" data-verb="bin">
          <svg class="act-glyph" viewBox="0 0 24 24" aria-hidden="true">
            <g class="glyph-bin">
              <g class="bin-lid">
                <path d="M9.6 4.6h4.8"/>
                <path d="M4.6 7.4h14.8"/>
              </g>
              <path d="M6.9 7.4l.9 11.9a1.9 1.9 0 0 0 1.9 1.8h4.6a1.9 1.9 0 0 0 1.9-1.8l.9-11.9"/>
              <path d="M10.3 11v6.4M13.7 11v6.4"/>
            </g>
            <g class="glyph-put">
              <path d="M12 4v9.4"/>
              <path d="M8.2 9.8 12 13.6l3.8-3.8"/>
              <path d="M4.8 19.4h14.4"/>
            </g>
          </svg>
          <span id="act-bin-label"></span>
        </button>
      </div>

      <!-- HOW MANY, and only ever for a stack of more than one — there is never
           more than one of a unique, and one of something is not an amount worth
           asking about. It replaces the verbs rather than joining them, because
           while it is up there is exactly one question on the table. -->
      <div id="detail-count" class="detail-count">
        <button class="count-step" type="button" data-step="-1" aria-label="へらす">−</button>
        <span id="count-n" class="count-n">1</span>
        <button class="count-step" type="button" data-step="1" aria-label="ふやす">＋</button>
        <button id="count-all" class="count-all" type="button">ぜんぶ</button>
        <button id="count-go" class="count-go" type="button">すてる</button>
      </div>
    </div>
  </div>
</div>

<!-- THE FRONT DOOR. A whole screen, on for as long as the art takes to decode.

     The drawing behind it is bg-menu.png — a redrawn one, square where the old
     one was portrait, and the change of shape is the whole reason the layout
     below is what it is. Measured off it, as a fraction of its height: dead flat
     sky to 0.33, soft cloud to 0.55, mountains 0.57 to 0.62, and the meadow with
     the three of them lying in it from 0.70 down.

     THE CAST MOVED TO THE MIDDLE. In the old drawing they stood apart at the two
     bottom corners and left a clean corridor between them, which is where the
     button used to go. In this one they are together in the centre of the
     meadow, so the whole bottom third is theirs and nothing may be put over it.
     Everything therefore lives ABOVE the mountains — see the padding on the
     panel, which is measured in `vw` for the reason given there.

     Nothing here may come out of `IMG`; see the note on loadArt. Both files this
     screen uses — the drawing and the car — are fetched by the browser on its
     own account, outside the batch loadArt() awaits. -->
<div id="start" class="start">

  <div class="start-sheet">

    <header class="start-head">
      <p class="start-eyebrow">ちいさな ほし</p>
      <!-- The space is for whoever is listening rather than looking: without it
           the accessible name runs the two halves together. It costs nothing on
           screen, since a trailing space at a forced break is dropped. -->
      <h1 class="start-title">ちいかわと <br>ひだまり</h1>
    </header>

    <div class="start-foot">
      <!-- How far in we are, as a drive. The car faces left, so it sets off from
           the right-hand kerb and the road behind it is the stretch already
           covered. One number drives all of it — `--p`, written by main.js as
           each file lands.

           It is a bar in the sky rather than a path on the ground, and that is
           the one thing this drawing costs: the ground is where the three of them
           are. Given the choice between a road across their faces and a road
           reading honestly as a piece of interface, it reads as interface. -->
      <div id="loadbar" class="loadbar">
        <div class="loadbar-road"></div>
        <div class="loadbar-done"></div>
        <img id="loadbar-car" class="loadbar-car" alt="" decoding="async">
      </div>

      <p class="start-status">
        <!-- Reads as loading until main.js has the art decoded, then it swaps
             to the invitation and the button below it turns on. Tapping early
             does nothing, because the listener is registered in the same module
             that awaits the load. -->
        <span id="start-sub" class="start-sub">よみこみちゅう…</span>
        <span id="start-pct" class="start-pct">0%</span>
      </p>

      <!-- Empty, and therefore not displayed, unless the load fails. -->
      <p id="start-note" class="start-note"></p>

      <!-- The affordance, not the mechanism: the press is caught on the whole
           overlay, so anywhere on the screen still works. -->
      <button id="start-go" class="start-go" type="button">はじめる</button>
    </div>

  </div>
</div>

<!-- Which of the three is driving today. Here rather than in main.js because
     main.js is a module: it does not run until three.js and every other import
     has been fetched and evaluated, and that wait is precisely what this car is
     on screen to cover. Two lines at parse time get it moving straight away. -->
<script>
  document.getElementById('loadbar-car').src =
    './asset/images/loading-' + (1 + Math.floor(Math.random() * 3)) + '.png';
</script>

<!-- POSING, which is the other half of having a camera. Shown only while the
     lens is turned round, low and centred where a thumb can reach across — this
     is the one control you use WHILE looking at the result rather than before.

     The faces are yours to pick and stay picked until you turn the view off,
     which is what makes it posing rather than a mood: you decide how you want
     to look in the picture, then take it. See POSES in main.js. -->
<!-- THE SHUTTER. A cream ring with a pink disc inside it, low and centred, and
     big — which is not decoration but the one arrangement every camera app on
     every phone has converged on, so a player already knows what it is and where
     to put their thumb before being told anything.

     PINK NOW, WHERE IT WAS RED, and the geometry is untouched. #E8555F was a
     recording light: it was the one colour in the app that came from outside
     this world, and it was doing its job by being alien to everything around it.
     The disc is from the same family as --accent and --pink now, so it belongs
     to the palette and is still the only saturated thing on a screen that is
     otherwise meadow and sky. What it does NOT give up is the shape — perfect
     circles, crisp edges, no outline — because the shape is what says shutter.
     See .shot-ring in the stylesheet for the drawn version that was tried
     instead and reverted.

     It carries no caption where every other control here does: a shutter is the
     one control that has never needed a word, and 「とる」 under it would only
     say what the shape already says.

     It only exists while the lens is turned round. A shutter in a view with no
     camera in it would be a promise about a picture nobody could compose.

     THREE RINGS RATHER THAN TWO, and the outermost is the one that was missing.
     A cream ring on its own is the right drawing over a meadow and nearly
     invisible over a bright noon sky or a snowfield — which is to say it went
     quiet in exactly the conditions somebody is most likely to be taking a
     picture in. The app's usual answer is a white rim, and that cannot help here
     because white is what it has to survive; so this one is an ink hairline
     outside the cream, which separates it from a pale sky and a dark one alike.
     It matters more now than it did: a pale pink disc leans on that edge in a
     way a red one never had to.

     The ring is a child rather than the button's own border because the press
     moves the two halves by different amounts, and one element cannot do two
     things to one transform. -->
<button id="shot-btn" class="shot-btn ctl-fade is-gone" type="button">
  <span class="shot-ring"></span>
  <span class="sr-only">しゃしんを とる</span>
</button>


<!-- WHAT YOU JUST TOOK. The picture is shown before it goes anywhere, which is
     both the nicer moment — you get to see it — and the only mechanism that
     works everywhere. A silent download of a blob is unreliable on iOS, where
     it may open a tab or do nothing visible at all; a sheet with the image in
     it gives the two paths that DO work: the share sheet, and a long press on
     the picture itself.

     Nothing here touches a server. The photograph is made in the browser's own
     memory and never leaves the device unless you share it, which is why this
     works identically on a static host like GitHub Pages. -->
<div id="photo-sheet" class="photo-sheet is-gone">
  <div class="photo-card">
    <img id="photo-img" class="photo-img" alt="とったしゃしん">
    <div class="photo-row">
      <button id="photo-share" class="photo-btn is-gone" type="button">シェア</button>
      <button id="photo-save" class="photo-btn" type="button">ほぞん</button>
      <button id="photo-close" class="photo-btn photo-close" type="button">とじる</button>
    </div>
  </div>
</div>

<!-- WHAT YOU JUST LEARNED YOU CAN DO. Shown once, when the camera first reaches
     your hands, because the button appearing in the corner is the whole of the
     unlock and a corner is exactly where a player who is looking at the camera
     they just picked up is not looking.

     It says what you got and where it went, and then it goes away by itself. No
     dismiss button: a notice you have to close is a decision, and there is
     nothing here to decide. -->
<div id="unlock" class="unlock is-gone" role="status" aria-live="polite">
  <span class="unlock-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M3.6 8.2h3.1l1.5-2h7.6l1.5 2h3.1v10.4H3.6Z"/>
      <circle cx="12" cy="13.2" r="3.4"/>
    </svg>
  </span>
  <span class="unlock-say">
    <b>カメラを てにいれた！</b>
    <i>ひだりうえの ボタンで じぶんを とれるよ</i>
  </span>
</div>

<!-- The shutter's own flash. A photograph you cannot hear needs to be one you
     can see happen, or a press with a silent save behind it reads as a button
     that did nothing. One frame of white, faded out by the animation. -->
<div id="shot-flash" class="shot-flash"></div>

<div class="rotate-hint"><p>たてむきに してね</p></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
